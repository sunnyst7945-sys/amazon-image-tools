<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片批量无损缩放工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  --bg: #f8f9fa;
  --card: #fff;
  --border: #e2e6ea;
  --text: #2c3e50;
  --text2: #6c757d;
  --accent: #4f6ef6;
  --accent-h: #3b5de7;
  --danger: #e74c3c;
  --success: #27ae60;
  --warn: #f0a020;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}
.container { max-width: 960px; margin: 0 auto; padding: 20px; }

.header { text-align: center; padding: 28px 0 20px; }
.header h1 { font-size: 26px; font-weight: 700; }
.header .sub { font-size: 14px; color: var(--text2); margin-top: 4px; }
.header .url-bar {
  display: inline-flex; align-items: center; gap: 8px;
  margin-top: 12px; padding: 6px 16px;
  background: #f0f3ff; border: 1px solid #d0daff;
  border-radius: 20px; font-size: 12px; color: var(--accent);
}
.header .url-bar button {
  background: none; border: 1px solid var(--accent); border-radius: 12px;
  padding: 2px 10px; font-size: 11px; color: var(--accent); cursor: pointer;
}
.header .url-bar button:hover { background: var(--accent); color: #fff; }

.upload-zone {
  background: var(--card); border: 2px dashed var(--border);
  border-radius: var(--radius); padding: 36px 24px; text-align: center;
  cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow);
  margin-bottom: 16px; position: relative;
}
.upload-zone:hover,.upload-zone.drag-over { border-color: var(--accent); background: #f0f3ff; }
.upload-zone .icon { font-size: 40px; display: block; margin-bottom: 8px; }
.upload-zone .text { font-size: 14px; color: var(--text2); }
.upload-zone .hint { font-size: 11px; color: #adb5bd; margin-top: 2px; }
.upload-zone input[type="file"] { position:absolute; inset:0; opacity:0; cursor:pointer; z-index:2; }

.image-list { display: none; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.image-list.show { display: flex; }
.img-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px; width: 130px; text-align: center;
  box-shadow: var(--shadow); position: relative;
}
.img-card .thumb {
  width: 100%; height: 100px; object-fit: cover; border-radius: 4px;
  background: #fafafa; display: block;
}
.img-card .name { font-size: 10px; color: var(--text2); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.img-card .size { font-size: 10px; color: #adb5bd; }
.img-card .remove {
  position: absolute; top: 2px; right: 4px;
  background: rgba(0,0,0,0.5); color: #fff; border: none;
  border-radius: 50%; width: 20px; height: 20px; font-size: 12px;
  cursor: pointer; line-height: 18px; text-align: center;
}
.img-card .remove:hover { background: var(--danger); }

.controls {
  display: none; gap: 14px; flex-wrap: wrap; align-items: flex-end;
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px;
  box-shadow: var(--shadow); margin-bottom: 16px;
}
.controls.show { display: flex; }
.ctrl-group { display: flex; flex-direction: column; gap: 4px; }
.ctrl-group label { font-size: 12px; font-weight: 600; color: var(--text2); }
.ctrl-group input[type="number"] {
  width: 100px; padding: 7px 10px; border: 1px solid var(--border);
  border-radius: 6px; font-size: 14px; background: #f4f6f8; outline: none;
}
.ctrl-group input[type="number"]:focus { border-color: var(--accent); }
.ctrl-group select {
  padding: 7px 10px; border: 1px solid var(--border);
  border-radius: 6px; font-size: 13px; background: var(--card); outline: none;
}
.lock-toggle {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; cursor: pointer; user-select: none;
  padding: 4px 10px; border-radius: 14px; border: 1px solid var(--border);
  background: var(--card);
}
.lock-toggle.locked { color: var(--accent); border-color: var(--accent); }
.lock-toggle.unlocked { color: var(--danger); border-color: var(--danger); }

.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  padding: 10px 20px; border: none; border-radius: 8px;
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-p { background: var(--accent); color: #fff; }
.btn-p:hover:not(:disabled) { background: var(--accent-h); }
.btn-s { background: var(--success); color: #fff; }
.btn-s:hover:not(:disabled) { background: #219a52; }
.btn-o { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-o:hover:not(:disabled) { background: #f4f6f8; }
.btn-d { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
.btn-d:hover:not(:disabled) { background: #fdecea; }

.results {
  display: none; gap: 10px; flex-wrap: wrap;
  margin-bottom: 16px;
}
.results.show { display: flex; }
.res-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px; width: 130px; text-align: center;
  box-shadow: var(--shadow);
}
.res-card .thumb { width: 100%; height: 100px; object-fit: contain; border-radius: 4px; background: #fafafa; }
.res-card .info { font-size: 10px; color: var(--text2); margin-top: 3px; }
.res-card .info2 { font-size: 9px; color: #adb5bd; }

.progress-wrap {
  display: none; margin-bottom: 14px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow);
}
.progress-wrap.show { display: block; }
.progress-bar {
  height: 8px; background: #e9ecef; border-radius: 4px; overflow: hidden; margin: 8px 0;
}
.progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.3s; width: 0%; }
.progress-text { font-size: 12px; color: var(--text2); text-align: center; }

.status-bar {
  display: none; gap: 12px; align-items: center; justify-content: center;
  font-size: 12px; color: var(--text2); margin-bottom: 12px;
}
.status-bar.show { display: flex; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; }
.status-dot.online { background: var(--success); }
.status-dot.offline { background: #ccc; }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #2c3e50; color: #fff; padding: 10px 24px;
  border-radius: 8px; font-size: 13px; z-index: 999;
  opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; }

.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 1000;
  align-items: center; justify-content: center; padding: 24px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card); border-radius: 14px; box-shadow: 0 8px 40px rgba(0,0,0,0.2);
  max-width: 600px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 24px;
  position: relative;
}
.modal h3 { font-size: 18px; margin-bottom: 14px; }
.modal .close {
  position: absolute; top: 12px; right: 16px; border: none; background: none;
  font-size: 22px; cursor: pointer; color: var(--text2);
}
.modal .path-row { display: flex; gap: 8px; margin-bottom: 12px; }
.modal .path-row input { flex:1; padding:8px 12px; border:1px solid var(--border); border-radius:6px; font-size:13px; outline:none; }
.modal .quick-dirs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.modal .quick-dirs button {
  padding: 4px 12px; border: 1px solid var(--border); border-radius: 14px;
  font-size: 11px; background: var(--card); cursor: pointer; transition: all 0.15s;
}
.modal .quick-dirs button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.modal .file-list { max-height: 200px; overflow-y: auto; margin-bottom: 12px; }
.modal .file-item { font-size: 12px; padding: 3px 0; color: var(--text2); border-bottom: 1px solid #f0f0f0; }
.modal .result-tip { font-size: 12px; margin-top: 10px; padding: 10px; border-radius: 6px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📐 图片批量无损缩放工具</h1>
    <p class="sub">拖入多张图片 · 统一设置尺寸 · 批量导出 ZIP / 单张保存</p>
    <div class="url-bar">
      🔗 <span id="pageUrl">加载中…</span>
      <button id="btnCopyUrl">复制链接</button>
    </div>
  </div>
  <div class="status-bar show" id="statusBar">
    <span class="status-dot online" id="statusDot"></span>
    <span id="statusText">检测保存服务…</span>
  </div>
  <div class="upload-zone" id="uploadZone">
    <span class="icon">🖼️</span>
    <div class="text">拖拽多张图片到这里，或点击选择</div>
    <div class="hint">支持 JPG / PNG / WebP / BMP / GIF · 可多选</div>
    <input type="file" id="fileInput" accept="image/*" multiple>
  </div>
  <div class="image-list" id="imageList"></div>
  <div class="controls" id="controls">
    <div class="ctrl-group"><label>目标宽度</label><input type="number" id="targetW" min="1" max="20000" placeholder="宽度 px"></div>
    <div class="ctrl-group"><label>目标高度</label><input type="number" id="targetH" min="1" max="20000" placeholder="高度 px"></div>
    <span class="lock-toggle unlocked" id="lockToggle">🔓 自由尺寸</span>
    <div class="ctrl-group"><label>输出格式</label><select id="outFmt"><option value="png">PNG (无损)</option><option value="jpg">JPEG (有损)</option></select></div>
    <div class="ctrl-group" id="qualityGrp" style="display:none"><label>JPEG 质量</label><input type="range" id="quality" min="10" max="100" value="92" style="width:80px"></div>
    <div style="display:flex;align-items:flex-end;"><span id="totalInfo" style="font-size:12px;color:var(--text2);white-space:nowrap;"></span></div>
  </div>
  <div class="progress-wrap" id="progressWrap"><div class="progress-text" id="progressText">准备处理…</div><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div>
  <div class="results" id="results"></div>
  <div class="btn-row" id="actionButtons" style="display:none">
    <button class="btn btn-p" id="btnProcess">⚡ 批量处理</button>
    <button class="btn btn-s" id="btnDownloadZip">📦 下载 ZIP</button>
    <button class="btn btn-p" id="btnSaveAll">💾 保存到本地文件夹</button>
    <button class="btn btn-o" id="btnClear">✕ 清空列表</button>
  </div>
</div>
<div class="modal-overlay" id="saveModal">
  <div class="modal">
    <button class="close" id="closeModal">&times;</button>
    <h3>💾 批量保存到本地文件夹</h3>
    <div class="path-row"><input type="text" id="saveFolder" placeholder="文件夹路径"></div>
    <div class="quick-dirs">
      <button data-path="C:/Users/Administrator/Desktop">桌面</button>
      <button data-path="C:/Users/Administrator/Downloads">下载</button>
      <button data-path="C:/Users/Administrator/Pictures">图片</button>
      <button data-path="D:/">D盘</button>
      <button data-path="E:/">E盘</button>
      <button data-path="F:/">F盘</button>
    </div>
    <div class="file-list" id="fileList"></div>
    <div class="btn-row">
      <button class="btn btn-p" id="btnConfirmSave">✅ 确认保存</button>
      <button class="btn btn-o" id="btnCancelSave">取消</button>
    </div>
    <div class="result-tip" id="saveResult"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function() {
  let images = []; let processed = []; let lockRatio = false; let serverAvailable = false;
  const uploadZone = document.getElementById('uploadZone');
  const fileInput = document.getElementById('fileInput');
  const imageList = document.getElementById('imageList');
  const controls = document.getElementById('controls');
  const targetW = document.getElementById('targetW');
  const targetH = document.getElementById('targetH');
  const lockToggle = document.getElementById('lockToggle');
  const outFmt = document.getElementById('outFmt');
  const qualityGrp = document.getElementById('qualityGrp');
  const quality = document.getElementById('quality');
  const totalInfo = document.getElementById('totalInfo');
  const progressWrap = document.getElementById('progressWrap');
  const progressText = document.getElementById('progressText');
  const progressFill = document.getElementById('progressFill');
  const results = document.getElementById('results');
  const actionButtons = document.getElementById('actionButtons');
  const btnProcess = document.getElementById('btnProcess');
  const btnDownloadZip = document.getElementById('btnDownloadZip');
  const btnSaveAll = document.getElementById('btnSaveAll');
  const btnClear = document.getElementById('btnClear');
  const saveModal = document.getElementById('saveModal');
  const saveFolder = document.getElementById('saveFolder');
  const fileList = document.getElementById('fileList');
  const saveResult = document.getElementById('saveResult');
  const statusBar = document.getElementById('statusBar');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const pageUrl = document.getElementById('pageUrl');
  const toast = document.getElementById('toast');
  const SHARE_URL = 'https://sunnyst7945-sys.github.io/amazon-image-tools/image-resizer.html';
  pageUrl.textContent = SHARE_URL;
  document.getElementById('btnCopyUrl').addEventListener('click', () => {
    navigator.clipboard.writeText(SHARE_URL).then(() => showToast('✅ 链接已复制，可分享给同事'));
  });
  saveFolder.value = 'C:/Users/Administrator/Desktop';
  checkServer();
  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
  }
  async function checkServer() {
    try {
      const resp = await fetch('http://127.0.0.1:8769/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image: 'dGVzdA==', filename: '_check.png' }), signal: AbortSignal.timeout(3000) });
      const r = await resp.json();
      serverAvailable = r.success || r.path;
    } catch(e) { serverAvailable = false; }
    if (serverAvailable) { statusDot.className = 'status-dot online'; statusText.textContent = '本地保存服务已连接 ✓'; }
    else { statusDot.className = 'status-dot offline'; statusText.textContent = '本地保存服务未连接，可复制链接用浏览器打开后下载'; }
  }
  function handleFiles(files) {
    const newFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
    if (!newFiles.length) { showToast('⚠️ 请选择图片文件'); return; }
    newFiles.forEach(file => {
      const obj = { file, img: null, w: 0, h: 0, name: file.name };
      images.push(obj);
      const idx = images.length - 1;
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { obj.img = img; obj.w = img.naturalWidth; obj.h = img.naturalHeight; updateCard(idx); };
      img.src = url;
      obj._url = url;
    });
    renderImageList(); updateUI();
  }
  fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFiles(fileInput.files); fileInput.value = ''; });
  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
  uploadZone.addEventListener('drop', e => { e.preventDefault(); uploadZone.classList.remove('drag-over'); if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
  document.addEventListener('paste', e => {
    const items = e.clipboardData?.items; if (!items) return;
    const files = []; for (const item of items) { if (item.type.startsWith('image/')) files.push(item.getAsFile()); }
    if (files.length) handleFiles(files);
  });
  function renderImageList() {
    imageList.innerHTML = images.map((img, i) => '<div class="img-card" id="card_'+i+'"><div class="remove" data-idx="'+i+'">×</div><img class="thumb" src="'+(img._url||'')+'" alt="'+img.name+'"><div class="name" title="'+img.name+'">'+img.name+'</div><div class="size" id="cardSize_'+i+'">'+(img.w?img.w+'×'+img.h:'加载中…')+'</div></div>').join('');
    imageList.querySelectorAll('.remove').forEach(btn => { btn.addEventListener('click', e => { e.stopPropagation(); removeImage(parseInt(btn.dataset.idx)); }); });
  }
  function updateCard(idx) { const el = document.getElementById('cardSize_'+idx); if (el && images[idx]) el.textContent = images[idx].w+'×'+images[idx].h+' px'; }
  function removeImage(idx) { if (images[idx]._url) URL.revokeObjectURL(images[idx]._url); images.splice(idx, 1); processed = []; results.innerHTML = ''; results.classList.remove('show'); renderImageList(); updateUI(); }
  function updateUI() {
    const hasImages = images.length > 0; const isSingle = images.length === 1;
    imageList.classList.toggle('show', hasImages); controls.classList.toggle('show', hasImages);
    actionButtons.style.display = hasImages ? 'flex' : 'none';
    btnProcess.textContent = isSingle ? '⚡ 直接处理' : '⚡ 批量处理';
    btnDownloadZip.style.display = isSingle ? 'none' : '';
    btnSaveAll.textContent = isSingle ? '💾 保存到本地文件夹' : '💾 批量保存到文件夹';
    if (hasImages && images[0] && images[0].w) {
      if (!targetW.value) { targetW.value = images[0].w; targetH.value = images[0].h; }
      totalInfo.textContent = isSingle ? '单张图片 · '+images[0].w+'×'+images[0].h : '共 '+images.length+' 张图片';
    }
  }
  lockToggle.addEventListener('click', () => { lockRatio = !lockRatio; lockToggle.textContent = lockRatio ? '🔒 锁定比例' : '🔓 自由尺寸'; lockToggle.className = 'lock-toggle '+(lockRatio?'locked':'unlocked'); });
  targetW.addEventListener('input', () => { if (lockRatio && images[0] && images[0].w) { targetH.value = Math.round(targetW.value/(images[0].w/images[0].h)); } });
  targetH.addEventListener('input', () => { if (lockRatio && images[0] && images[0].w) { targetW.value = Math.round(targetH.value*(images[0].w/images[0].h)); } });
  outFmt.addEventListener('change', () => { qualityGrp.style.display = outFmt.value==='jpg'?'':'none'; });
  function stepDownScale(srcCanvas, tw, th) {
    const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
    const draw=(d,s,dw,dh)=>{const x=d.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(s,0,0,dw,dh);};
    if (tw>=srcCanvas.width&&th>=srcCanvas.height) { const o=mk(tw,th); draw(o,srcCanvas,tw,th); return o; }
    let cw=srcCanvas.width,ch=srcCanvas.height,cur=srcCanvas;
    while(cw/2>=tw&&ch/2>=th){const nw=Math.floor(cw/2),nh=Math.floor(ch/2),n=mk(nw,nh);draw(n,cur,nw,nh);cur=n;cw=nw;ch=nh;}
    if(cw!==tw||ch!==th){const f=mk(tw,th);draw(f,cur,tw,th);return f;}
    return cur;
  }
  async function processImage(img, tw, th) {
    const s=document.createElement('canvas');s.width=img.w;s.height=img.h;s.getContext('2d').drawImage(img.img,0,0);
    const sc=stepDownScale(s,tw,th);
    const n=img.name.replace(/\.[^.]+$/,'')+'_'+tw+'x'+th;
    return {canvas:sc,w:tw,h:th,name:n,pngDataUrl:sc.toDataURL('image/png'),jpgDataUrl:sc.toDataURL('image/jpeg',0.92)};
  }
  btnProcess.addEventListener('click', async () => {
    if (!images.length) return;
    const tw=parseInt(targetW.value)||(images[0]?.w||800);
    const th=parseInt(targetH.value)||(images[0]?.h||600);
    if(tw<1||th<1){showToast('⚠️ 请输入有效尺寸');return;}
    const isSingle=images.length===1;
    btnProcess.disabled=true;btnDownloadZip.disabled=true;btnSaveAll.disabled=true;
    progressWrap.classList.add('show');processed=[];
    for(let i=0;i<images.length;i++){
      progressText.textContent='处理中… '+(i+1)+'/'+images.length;
      progressFill.style.width=((i/images.length)*100)+'%';
      processed.push(await processImage(images[i],tw,th));
      await new Promise(r=>setTimeout(r,30));
    }
    progressFill.style.width='100%';
    progressText.textContent='✅ 完成！'+(isSingle?'单图已处理':'共处理 '+processed.length+' 张');
    setTimeout(()=>progressWrap.classList.remove('show'),2000);
    if(isSingle&&processed[0]){
      const p=processed[0];
      results.innerHTML='<div style="width:100%;text-align:center;"><img src="'+p.pngDataUrl+'" style="max-width:100%;max-height:400px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,0.1);"><div style="margin-top:8px;font-size:13px;color:var(--text2);">'+p.w+' × '+p.h+' px</div><div style="margin-top:8px;display:flex;gap:8px;justify-content:center;"><button class="btn btn-s single-dl" data-fmt="png">💾 保存 PNG</button><button class="btn btn-p single-dl" data-fmt="jpg">💾 保存 JPG</button></div></div>';
      results.classList.add('show');
      results.querySelectorAll('.single-dl').forEach(btn=>{btn.addEventListener('click',async()=>{const fmt=btn.dataset.fmt;const d=fmt==='jpg'?p.jpgDataUrl:p.pngDataUrl;const f=p.name+'.'+fmt;if(serverAvailable){await saveViaServer(d,f,fmt.toUpperCase());}else{const a=document.createElement('a');a.href=d;a.download=f;a.click();showToast('✅ '+fmt.toUpperCase()+' 下载中…');}});});
    } else {
      results.innerHTML=processed.map(p=>'<div class="res-card"><img class="thumb" src="'+p.pngDataUrl+'"><div class="info">'+p.w+'×'+p.h+'</div><div class="info2">'+p.name+'.png</div></div>').join('');
      results.classList.add('show');
    }
    btnProcess.disabled=false;btnDownloadZip.disabled=false;btnSaveAll.disabled=false;
  });
  btnDownloadZip.addEventListener('click', async () => {
    if(!processed.length){showToast('⚠️ 请先批量处理图片');return;}
    btnDownloadZip.disabled=true;btnDownloadZip.textContent='⏳ 打包中…';
    const zip=new JSZip();const fmt=outFmt.value;
    for(const p of processed){
      let d,ext;
      if(fmt==='jpg'){d=p.jpgDataUrl;ext='jpg';}else{d=p.pngDataUrl;ext='png';}
      zip.file(p.name+'.'+ext,d.split(',')[1],{base64:true});
    }
    const blob=await zip.generateAsync({type:'blob'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='scaled_images_'+processed[0].w+'x'+processed[0].h+'.zip';a.click();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    btnDownloadZip.disabled=false;btnDownloadZip.textContent='📦 下载 ZIP';
    showToast('✅ ZIP 下载中，共 '+processed.length+' 张图片');
  });
  async function saveViaServer(dataUrl, filename, label) {
    const folder=saveFolder.value.trim()||'C:/Users/Administrator/Desktop';
    try{
      const resp=await fetch('http://127.0.0.1:8769/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:dataUrl,filename:filename,folder:folder}),signal:AbortSignal.timeout(10000)});
      const r=await resp.json();
      if(r.success){showToast('✅ '+label+' 已保存到: '+r.path);}else{showToast('❌ 保存失败');}
    }catch(e){showToast('⚠️ 保存服务未连接，尝试浏览器下载…');}
  }
  btnSaveAll.addEventListener('click', ()=>{
    if(!processed.length){showToast('⚠️ 请先批量处理图片');return;}
    if(!serverAvailable){showToast('⚠️ 本地保存服务未连接，请用浏览器打开此页面后下载 ZIP');return;}
    const fmt=outFmt.value;const ext=fmt==='jpg'?'jpg':'png';
    fileList.innerHTML=processed.map(p=>'<div class="file-item">📄 '+p.name+'.'+ext+'</div>').join('');
    saveResult.textContent='';saveResult.style.background='';saveModal.classList.add('show');
  });
  document.getElementById('btnConfirmSave').addEventListener('click', async ()=>{
    const folder=saveFolder.value.trim();if(!folder){showToast('⚠️ 请输入保存路径');return;}
    const fmt=outFmt.value;const ext=fmt==='jpg'?'jpg':'png';let saved=0,failed=0;
    saveResult.textContent='保存中…';saveResult.style.background='#f0f4ff';saveResult.style.color='#4a6cf7';
    for(const p of processed){
      try{
        const resp=await fetch('http://127.0.0.1:8769/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:fmt==='jpg'?p.jpgDataUrl:p.pngDataUrl,filename:p.name+'.'+ext,folder:folder}),signal:AbortSignal.timeout(10000)});
        const r=await resp.json();if(r.success)saved++;else failed++;
      }catch(e){failed++;}
    }
    saveResult.textContent='✅ 完成: 成功 '+saved+' 张, 失败 '+failed+' 张\n保存路径: '+folder;
    saveResult.style.background='#e8f5e9';saveResult.style.color='#27ae60';
  });
  document.getElementById('btnCancelSave').addEventListener('click', ()=>saveModal.classList.remove('show'));
  document.getElementById('closeModal').addEventListener('click', ()=>saveModal.classList.remove('show'));
  saveModal.addEventListener('click', e=>{if(e.target===saveModal)saveModal.classList.remove('show');});
  document.querySelectorAll('.quick-dirs button').forEach(btn=>{btn.addEventListener('click',()=>{saveFolder.value=btn.dataset.path;});});
  btnClear.addEventListener('click', ()=>{
    images.forEach(img=>{if(img._url)URL.revokeObjectURL(img._url);});
    images=[];processed=[];imageList.innerHTML='';imageList.classList.remove('show');
    results.innerHTML='';results.classList.remove('show');progressWrap.classList.remove('show');
    controls.classList.remove('show');actionButtons.style.display='none';targetW.value='';targetH.value='';fileInput.value='';
  });
})();
</script>
</body>
